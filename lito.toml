[package]
name = "lihttpto"
version = "0.1.0"

[lib]
name = "lihttpto"
module = "lihttpto"
archive = "lihttpto"

[[test]]
name = "lihttpto-tests"
sources = ["tests/main.cpp", "tests/header.cpp", "tests/cgi.cpp", "tests/body_transfer.cpp", "tests/request_line.cpp", "tests/request_head.cpp", "tests/request_body.cpp", "tests/response.cpp", "tests/connection.cpp", "tests/request_target.cpp", "tests/server.cpp"]
link-stdlib = false

[[test]]
name = "lihttpto-http-values-tests"
sources = ["tests/main.cpp", "tests/http_values.cpp"]

[[test]]
name = "lihttpto-event-stream-tests"
sources = ["tests/main.cpp", "tests/event_stream.cpp"]
link-stdlib = false

[[test]]
name = "lihttpto-url-baseline"
sources = ["tests/main.cpp", "tests/url_baseline.cpp"]
link-stdlib = false

[profile.base]
exceptions = false
rtti = false

[dependencies]
rstd-parse = { version = "0.1.2", pub = true }
rstd-std = { version = "0.1.2", pub = true }

[dev-dependencies]
rstd-json = { version = "0.1.2" }
rstd-cppstd = { version = "0.1.2" }
rstd-test = { version = "0.1.2" }
rstd-nostd = { version = "0.1.2", usage = "link" }
