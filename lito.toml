[package]
name = "lihttpto"
version = "0.1.1"
license = "MIT OR Apache-2.0"
authors = ["hypengw <hypengwip@gmail.com>"]

[lib]
name = "lihttpto"
module = "lihttpto"
archive = "lihttpto"

[[test]]
name = "lihttpto-tests"
sources = [
  "tests/main.cpp",
  "tests/client_codec.cpp",
  "tests/header.cpp",
  "tests/http2.cpp",
  "tests/cache.cpp",
  "tests/conditions.cpp",
  "tests/cgi.cpp",
  "tests/body_transfer.cpp",
  "tests/request_line.cpp",
  "tests/request_head.cpp",
  "tests/request_body.cpp",
  "tests/response_encoder.cpp",
  "tests/request_target.cpp",
  "tests/http_values.cpp",
  "tests/event_stream.cpp",
  "tests/upgrade.cpp",
  "tests/url_baseline.cpp",
]
link-stdlib = false

[profile.base]
exceptions = false
rtti = false

[dependencies]
rstd-parse = { version = "0.1.9", pub = true }
rstd-std = { version = "0.1.9", pub = true }

[dev-dependencies]
rstd-json = { version = "0.1.9" }
rstd-test = { version = "0.1.9" }
rstd-nostd = { version = "0.1.9", usage = "link" }
